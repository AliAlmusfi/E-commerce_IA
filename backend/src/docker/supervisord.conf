[supervisord]
nodaemon=true
logfile=/dev/null
logfile_maxbytes=0

[program:wsgi]
command=gunicorn e_commerce.wsgi:application --bind 0.0.0.0:8000 --workers 3
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:grpc]
command=python manage.py grpcserver    # or however you launch it
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
redirect_stderr=true