syntax = "proto3";

package inventory.v1;

service InventoryService {
  rpc GetProductById (GetProductByIdRequest) returns (Product);
  rpc GetProductQuantity (GetProductQuantityRequest) returns (ProductQuantity);
  rpc ReserveProduct (ReserveProductRequest) returns (ReserveProductResponse);
}

message GetProductByIdRequest {
  int64 id = 1;
}

message GetProductQuantityRequest {
  int64 id = 1;
}

message Product {
  int64 id = 1;
  string title = 2;
  string manufacturer = 3;
  string image = 4;
  int32 stock = 5;
  double price = 6;
}

message ProductQuantity {
  int64 id = 1;
  int32 stock = 2;
}

message ReserveProductRequest {
  int64 id = 1;
  int32 quantity = 2;
}

message ReserveProductResponse {
  bool success = 1;
  int32 remaining_stock = 2;
  string message = 3;
}