services:
  django-db:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: django_db
      MYSQL_USER: django_user
      MYSQL_PASSWORD: django_password
      MYSQL_ROOT_PASSWORD: root_password
    volumes:
      - django_db_data:/var/lib/mysql
    networks:
      - app-network
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD"]
      interval: 5s
      timeout: 5s
      retries: 15
      start_period: 30s

  flask-db:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: flask_db
      MYSQL_USER: flask_user
      MYSQL_PASSWORD: flask_password
      MYSQL_ROOT_PASSWORD: root_password
    volumes:
      - flask_db_data:/var/lib/mysql
    networks:
      - app-network
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD"]
      interval: 5s
      timeout: 5s
      retries: 15
      start_period: 30s

  redis:
    image: redis:7-alpine
    # maxmemory prevents Redis from eating all container RAM.
    # allkeys-lru is the safest eviction policy for a pure cache.
    # appendonly no + save "" = pure in-memory (fastest, cache is rebuilt on restart).
    command: >
      redis-server
      --appendonly no
      --save ""
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
    ports:
      - "6379:6379"   # optional: remove in prod, only needed for host debugging
    volumes:
      - redis_data:/data
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 30s
    # restart: unless-stopped

  django-app:
    # CHANGE: Use root as context, specify exact Dockerfile path
    build:
      context: .
      dockerfile: src/DockerFile
    env_file:
      - ./src/.env
    environment:
      - DJANGO_DEBUG=0
      - DATABASE_HOST=django-db
      - DATABASE_NAME=django_db
      - DATABASE_USER=django_user
      - DATABASE_PASSWORD=django_password
      - FLASK_GRPC_HOST=flask-app
      - FLASK_GRPC_PORT=50051
      - REDIS_URL=redis://redis:6379/1
      - CELERY_BROKER_URL=amqp://guest:guest@rabbitmq:5672//
    command: gunicorn e_commerce.wsgi:application --bind 0.0.0.0:8000 --workers 3 --timeout 120
    volumes:
      # CHANGE: Update your path to include backend/
      - ./src:/app
      - ./secrets/firebase-service-account.json:/app/secrets/firebase-service-account.json:ro
    ports:
      - "8000:8000"
    depends_on:
      django-db:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - app-network

  flask-app:
    # CHANGE: Use root as context, specify exact Dockerfile path
    build:
      context: .
      dockerfile: Inventory/DockerFile
    env_file:
      - ./Inventory/inventory.env
    environment:
      - DATABASE_HOST=flask-db
      - DATABASE_NAME=flask_db
      - DATABASE_USER=flask_user
      - DATABASE_PASSWORD=flask_password
    volumes:
      # CHANGE: Update your path to include backend/
      - ./Inventory:/app
    ports:
      - "50051:50051"
    depends_on:
      flask-db:
        condition: service_healthy
    networks:
      - app-network


  rabbitmq:
    image: rabbitmq:3-management
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
      CELERY_BROKER_URL: amqp://guest:guest@rabbitmq:5672//
      CELERY_RESULT_BACKEND: rpc:// 
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 30s


  celery-worker:
    build:
      context: .
      dockerfile: src/DockerFile
    env_file:
      - ./src/.env
    environment:
      - DJANGO_DEBUG=0
      - DATABASE_HOST=django-db
      - DATABASE_NAME=django_db
      - DATABASE_USER=django_user
      - DATABASE_PASSWORD=django_password
      - FLASK_GRPC_HOST=flask-app
      - FLASK_GRPC_PORT=50051
      - REDIS_URL=redis://redis:6379/1
      - CELERY_BROKER_URL=amqp://guest:guest@rabbitmq:5672//
    entrypoint: ["celery", "-A", "e_commerce", "worker", "-l", "info"]
    volumes:
      - ./src:/app
      - ./secrets/firebase-service-account.json:/app/secrets/firebase-service-account.json:ro
    depends_on:
      rabbitmq:
        condition: service_healthy
      django-db:
        condition: service_healthy
    networks:
      - app-network

volumes:
  django_db_data:
  flask_db_data:
  redis_data:
  rabbitmq_data:


networks:
  app-network:
    driver: bridge