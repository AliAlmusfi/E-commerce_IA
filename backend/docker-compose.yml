services:  
  django-db:
    image: mysql:8.4
    command: >
      --server-id=1
      --log-bin=mysql-bin
      --gtid-mode=ON
      --enforce-gtid-consistency=ON
    environment:
      MYSQL_DATABASE: django_db
      MYSQL_USER: django_user
      MYSQL_PASSWORD: django_password
      MYSQL_ROOT_PASSWORD: root_password
    volumes:
      - django_db_data:/var/lib/mysql
      - ./mysql-init/primary-init.sql:/docker-entrypoint-initdb.d/01-primary-init.sql:ro
    networks:
      - app-network
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD"]
      interval: 5s
      timeout: 5s
      retries: 15
      start_period: 30s

  django-replica-db:
    image: mysql:8.4
    command: >
      --server-id=2
      --gtid-mode=ON
      --enforce-gtid-consistency=ON
      --read-only=1
    environment:
      MYSQL_ROOT_PASSWORD: root_password
    volumes:
      - django_replica_db_data:/var/lib/mysql
      - ./mysql-init/replica-init.sql:/docker-entrypoint-initdb.d/01-replica-init.sql:ro
    depends_on:
      django-db:
        condition: service_healthy
    networks:
      - app-network
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD"]
      interval: 5s
      timeout: 5s
      retries: 15
      start_period: 30s

  flask-db:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: flask_db
      MYSQL_USER: flask_user
      MYSQL_PASSWORD: flask_password
      MYSQL_ROOT_PASSWORD: root_password
    volumes:
      - flask_db_data:/var/lib/mysql
    networks:
      - app-network
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD"]
      interval: 5s
      timeout: 5s
      retries: 15
      start_period: 30s

  redis:
    image: redis:7-alpine
    # maxmemory prevents Redis from eating all container RAM.
    # allkeys-lru is the safest eviction policy for a pure cache.
    # appendonly no + save "" = pure in-memory (fastest, cache is rebuilt on restart).
    command: >
      redis-server
      --appendonly no
      --save ""
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
    ports:
      - "6379:6379"   # optional: remove in prod, only needed for host debugging
    volumes:
      - redis_data:/data
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 30s
    # restart: unless-stopped

  django-app:
    # CHANGE: Use root as context, specify exact Dockerfile path
    build:
      context: .
      dockerfile: src/DockerFile
    env_file:
      - ./src/.env
    environment:
      - DJANGO_DEBUG=0
      - DATABASE_HOST=django-db
      - DATABASE_NAME=django_db
      - DATABASE_USER=django_user
      - DATABASE_PASSWORD=django_password
      - REPLICA_DATABASE_HOST=django-replica-db
      - REPLICA_DATABASE_NAME=django_db
      - REPLICA_DATABASE_USER=django_user
      - REPLICA_DATABASE_PASSWORD=django_password
      - FLASK_GRPC_HOST=flask-app
      - FLASK_GRPC_PORT=50051
      - REDIS_URL=redis://redis:6379/1
    command: gunicorn e_commerce.wsgi:application --bind 0.0.0.0:8000 --workers 3 --timeout 120
    volumes:
      # CHANGE: Update your path to include backend/
      - ./src:/app
      - ./secrets/firebase-service-account.json:/app/secrets/firebase-service-account.json:ro
    ports:
      - "8000:8000"
    depends_on:
      django-db:
        condition: service_healthy
      django-replica-db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - app-network

  flask-app:
    # CHANGE: Use root as context, specify exact Dockerfile path
    build:
      context: .
      dockerfile: Inventory/DockerFile
    env_file:
      - ./Inventory/inventory.env
    environment:
      - DATABASE_HOST=flask-db
      - DATABASE_NAME=flask_db
      - DATABASE_USER=flask_user
      - DATABASE_PASSWORD=flask_password
    volumes:
      # CHANGE: Update your path to include backend/
      - ./Inventory:/app
    ports:
      - "50051:50051"
    depends_on:
      flask-db:
        condition: service_healthy
    networks:
      - app-network

volumes:
  django_db_data:
  django_replica_db_data:
  flask_db_data:
  redis_data:

networks:
  app-network:
    driver: bridge