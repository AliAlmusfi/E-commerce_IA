# Define a pool of Django application servers
upstream django_app_pool {
    # Docker's internal DNS will resolve 'django-app' to all running replicas
    least_conn;
    server django-app:8000;
    # You can add more explicit servers if needed, but the service name is sufficient
}

upstream websocket_app_pool {
    ip_hash;                    # <-- sticky sessions for WS
    server websocket-app:8001;
}

server {
    listen 80;

    # WebSocket routing remains the same
    location /ws/ {
        proxy_pass http://websocket_app_pool; # Point to the  upstream block
        
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 3600s;   # keep idle WS connections alive
    }

    # HTTP routing now points to the upstream pool
    location / {
        proxy_pass http://django_app_pool; # Point to the upstream block
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}